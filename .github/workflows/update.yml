# 30分ごとに無料のデータ源（Mastodon / Misskey / Bluesky / RSS / manual フォルダ）から収集し、
# 集計したダッシュボードを GitHub Pages に公開する。公開リポジトリなら Actions も Pages も無料。
name: update-site

on:
  schedule:
    - cron: "7,37 * * * *"   # 毎時 7分・37分（UTC）。混雑時は数分〜十数分遅れることがある
  workflow_dispatch:          # Actions 画面の「Run workflow」で今すぐ実行
  push:
    branches: [main]
    paths-ignore: ["archive/**", "**.md", "note_auto/**", "tests/test_note_auto.py", ".github/workflows/note-auto.yml"]

permissions:
  contents: write   # 収集した投稿のアーカイブをコミットするため
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # manual/ のファイルの日時をコミット履歴から取るため

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect, extract and build
        env:
          SVWB_SOCIAL: "on"
          SVWB_DB_PATH: data/meta.db
          # 以下は任意。Settings → Secrets and variables → Actions で設定する
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # 設定すると Claude で抽出（有料）
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}         # 設定すると X からも収集（有料）
        run: python cli.py update-site --out site/index.html

      - name: Save archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then
            echo "新しい投稿はありませんでした"
          else
            git commit -m "data: 投稿アーカイブを更新 [skip ci]"
            for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
